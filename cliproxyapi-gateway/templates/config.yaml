# CLIProxyAPI 最小可用配置(v8 布局)。换掉两处密钥再上线。
config-version: 8

server:
  host: ""            # 空 = 监听所有网卡(局域网才能访问)
  port: 8317

# 管理 API + 内嵌管理面板(CPAMC)http://<host>:8317/management.html
management:
  allow-remote: true           # false(默认)时只有 localhost 能访问管理接口
  secret-key: "<生成的管理密钥>"  # 明文写在这是可以的:启动时会被 bcrypt 哈希后写回文件
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# 客户端用来调网关的 key(不是上游提供方的 key)
access:
  api-keys:
    - "<生成一个 sk- 开头的客户端 key>"

# 上游提供方的 key(顶层 api-keys,与 access.api-keys 是两回事)。按需取消注释。
# api-keys:
#   gemini:
#     - name: gemini-aistudio            # 组名,一个组 = 一个 endpoint + 一组 key
#       base-url: "https://generativelanguage.googleapis.com"
#       keys:
#         - api-key: "<AI Studio key>"
#   # claude / xai / meta / openai-compatibility 同理,见官方 config.example.yaml
